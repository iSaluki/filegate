name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet and format
        run: make vet
      - name: Test
        run: make test
      - name: Build
        run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: filegate-binaries
          path: dist/
